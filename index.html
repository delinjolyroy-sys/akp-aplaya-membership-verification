<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aplaya Chapter - Membership Verification</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        color: #222;
    }

    .container {
        max-width: 500px;
        margin: 30px auto;
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        text-align: center;
    }

    .logo {
        width: 150px;
        height: 150px;
        object-fit: contain;
        margin-bottom: 10px;
    }

    h1 {
        font-size: 24px;
        margin: 5px 0;
    }

    h2 {
        font-size: 20px;
        margin: 5px 0 20px;
    }

    .verification {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 10px;
        margin: 15px 0;
        line-height: 1.5;
    }

    .verified {
        display: inline-block;
        background: #198754;
        color: white;
        padding: 10px 20px;
        border-radius: 25px;
        font-weight: bold;
        margin: 10px 0 20px;
    }

    .member-photo {
        width: 180px;
        height: 220px;
        object-fit: cover;
        border-radius: 10px;
        border: 3px solid #ddd;
        margin-bottom: 15px;
    }

    .details {
        text-align: left;
        margin-top: 10px;
    }

    .details p {
        margin: 10px 0;
        padding: 8px;
        border-bottom: 1px solid #ddd;
    }

    .label {
        font-weight: bold;
    }

    .footer {
        margin-top: 20px;
        font-size: 13px;
        color: #777;
    }
</style>
</head>

<body>

<div class="container">

    <img src="aplaya-logo.png" class="logo" alt="Aplaya Chapter Logo">

    <h1>ALPHA KAPPA RHO</h1>
    <h2>Aplaya Chapter</h2>

    <div class="verified">
        ✓ LEGIT MEMBER
    </div>

    <img
        src="jeprrie-candido.jpg"
        class="member-photo"
        alt="Jeprrie Candido"
    >

    <div class="verification">

        <div class="details">

            <p>
                <span class="label">Name:</span><br>
                Jeprrie Candido
            </p>

            <p>
                <span class="label">Position:</span><br>
                Vice Grand Skeptron
            </p>

            <p>
                <span class="label">Membership ID No.:</span><br>
                AKP-APLY-001
            </p>

            <p>
                <span class="label">Date Survive:</span><br>
                August 30, 2021
            </p>

            <p>
                <span class="label">Status:</span><br>
                Legit Member
            </p>

        </div>

    </div>

    <div class="footer">
        This page verifies the membership record of the
        Aplaya Chapter.
    </div>

</div>

</body>
</html>
